version: 1
default_gate: ask.domain

providers:
  anthropic:
    type: langchain_anthropic
    model: claude-sonnet-5
    max_tokens: 4096
    timeout_seconds: 60
    supports_temperature: false
  openai:
    type: langchain_openai
    model: gpt-4o
    max_tokens: 4096
    timeout_seconds: 60
  ollama:
    type: langchain_ollama
    model: llama3.1
    base_url: http://localhost:11434
    timeout_seconds: 120

gates:
  ask.domain:
    provider: anthropic
    temperature: 0.2
    review_required: true
  research.score:
    provider: anthropic
    temperature: 0.2
    review_required: true
    concurrency_cap: 5
  card.evaluate:
    provider: anthropic
    temperature: 0.2
    review_required: true
    concurrency_cap: 5
  curation.connection_type:
    provider: anthropic
    temperature: 0.2
    review_required: true
    concurrency_cap: 5
